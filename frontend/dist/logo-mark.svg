<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="白泽 Baize">
  <title>白泽 · Baize</title>
  <defs>
    <linearGradient id="bzGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="0.48" stop-color="#10b981"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="bzSheen" x1="0.1" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 渐变方章（squircle）：白泽之印 -->
  <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#bzGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#bzSheen)"/>

  <!-- 白色几何「白」：丿 + 日（外框 / 中横 / 瞳） -->
  <g fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M29 10.5 L22.3 17"/>
    <rect x="20.6" y="16.8" width="22.8" height="25.2" rx="5.2"/>
    <path d="M20.6 29.4 L43.4 29.4"/>
  </g>
  <!-- 瞳：智慧之眼 -->
  <circle cx="32" cy="35.6" r="3.5" fill="#ffffff"/>

  <!-- 泽：水波弧（细节，放大时呈现） -->
  <path d="M13 49.6 C20 45.8 26 53.2 32 49.6 C38 46 44 53.2 51 49.6"
        fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round"/>
</svg>
