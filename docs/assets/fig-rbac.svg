<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar3" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0f766e"/>
    </marker>
  </defs>
  <rect width="820" height="340" fill="#f8fafc"/>
  <text x="32" y="34" font-size="18" font-weight="700" fill="#0f172a">RBAC 数据模型与权限判定</text>
  <text x="32" y="56" font-size="12" fill="#64748b">角色继承权限 · 用户级 grant/deny 覆盖优先 · 权限码 module:resource:action</text>

  <!-- User -->
  <rect x="32" y="100" width="150" height="70" rx="12" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
  <text x="107" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">用户 User</text>
  <text x="107" y="148" text-anchor="middle" font-size="10.5" fill="#64748b">users 表</text>

  <!-- Role -->
  <rect x="335" y="100" width="150" height="70" rx="12" fill="#ffffff" stroke="#06b6d4" stroke-width="2"/>
  <text x="410" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">角色 Role</text>
  <text x="410" y="148" text-anchor="middle" font-size="10.5" fill="#64748b">roles 表</text>

  <!-- Permission -->
  <rect x="638" y="100" width="150" height="70" rx="12" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="713" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">权限 Permission</text>
  <text x="713" y="148" text-anchor="middle" font-size="10.5" fill="#64748b">code: user:user:read</text>

  <!-- relations -->
  <line x1="182" y1="135" x2="331" y2="135" stroke="#0f766e" stroke-width="2" marker-end="url(#ar3)"/>
  <text x="256" y="124" text-anchor="middle" font-size="10" fill="#475569">user_roles</text>
  <line x1="485" y1="135" x2="634" y2="135" stroke="#0f766e" stroke-width="2" marker-end="url(#ar3)"/>
  <text x="560" y="124" text-anchor="middle" font-size="10" fill="#475569">role_permissions</text>

  <!-- user_permission override -->
  <rect x="335" y="232" width="150" height="70" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="410" y="258" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">用户级覆盖</text>
  <text x="410" y="278" text-anchor="middle" font-size="10.5" fill="#92400e">user_permissions</text>
  <text x="410" y="295" text-anchor="middle" font-size="10.5" fill="#92400e">effect: grant/deny</text>
  <line x1="182" y1="170" x2="330" y2="250" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ar3)"/>
  <text x="200" y="222" font-size="10" fill="#b45309">直接覆盖</text>
  <line x1="485" y1="250" x2="634" y2="155" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ar3)"/>

  <!-- decision box -->
  <rect x="32" y="280" width="756" height="44" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="410" y="307" text-anchor="middle" font-size="12" fill="#065f46">有效权限 = (角色权限 ∪ 用户 grant) − 用户 deny ｜ 缺权限返回 403 ｜ 令牌失效/黑名单返回 401</text>
</svg>
