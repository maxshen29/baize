<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DataScope Analytics · 多维数据分析平台</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="../lib/echarts.min.js"></script>
  <script src="../lib/echarts-gl.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">◆</span>
      <div>
        <div class="brand-title">DataScope Analytics</div>
        <div class="brand-sub">拖拽式多维数据分析 · SandDance 式探索 · 科研图表</div>
      </div>
    </div>
    <div id="toolbar" class="toolbar"></div>
  </header>

  <div class="layout">
    <!-- Left: data source + fields -->
    <aside class="left">
      <div id="dropZone" class="dropzone">
        <div class="dz-inner">
          <strong>拖入 CSV 文件</strong>
          <span>或点击右上角「上传 CSV」</span>
        </div>
        <input type="file" id="fileInput" accept=".csv,.txt,.tsv" hidden />
      </div>

      <div class="panel-title">字段 <span class="muted">(拖拽到右侧编码区)</span></div>
      <div class="legend">
        <span><i class="dot number"></i>数值</span>
        <span><i class="dot category"></i>分类</span>
        <span><i class="dot date"></i>日期</span>
      </div>
      <div id="fieldShelf" class="field-shelf"></div>
    </aside>

    <!-- Center: encoding + chart -->
    <main class="center">
      <div class="encoding-bar">
        <div id="encodingZones" class="zones"></div>
      </div>

      <div class="control-row">
        <div id="chartTypeTabs" class="chart-tabs"></div>
        <div id="options" class="options"></div>
      </div>

      <div id="viewTabs" class="view-tabs"></div>

      <div id="chartPanel" class="chart-panel">
        <div id="chart" class="chart"></div>
      </div>
      <div id="htmlPanel" class="html-panel" style="display:none"></div>
    </main>
  </div>

  <footer id="statusBar" class="statusbar"></footer>

  <script src="js/data.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
